<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>碰数</title>
  <style>
    :root {
      --bg: #0f1220;
      --panel: rgba(24, 29, 48, 0.88);
      --panel-2: rgba(31, 37, 61, 0.95);
      --line: rgba(255,255,255,0.1);
      --text: #eef2ff;
      --muted: #aeb6d9;
      --gold: #f6d365;
      --accent: #7c9cff;
      --accent-2: #8cf6d9;
      --danger: #ff7a90;
      --success: #74f0a9;
      --shadow: 0 18px 48px rgba(0,0,0,0.35);
      --radius: 22px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(124,156,255,0.18), transparent 28%),
        radial-gradient(circle at top right, rgba(140,246,217,0.14), transparent 20%),
        linear-gradient(160deg, #090b14 0%, #12172a 42%, #0d1020 100%);
      min-height: 100vh;
    }
    button, select {
      border: 0;
      border-radius: 16px;
      padding: 12px 18px;
      font-size: 14px;
    }
    button {
      background: linear-gradient(135deg, var(--accent), #5d77ff);
      color: white;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease, box-shadow .15s ease;
      box-shadow: 0 10px 24px rgba(93,119,255,0.25);
    }
    button:hover { transform: translateY(-1px); }
    button.secondary {
      background: rgba(255,255,255,0.08);
      box-shadow: none;
      border: 1px solid var(--line);
    }
    button.ghost {
      background: transparent;
      box-shadow: none;
      border: 1px solid var(--line);
    }
    button:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
    select {
      background: rgba(255,255,255,0.08);
      color: var(--text);
      border: 1px solid var(--line);
      outline: none;
    }
    .screen { display: none; min-height: 100vh; }
    .screen.active { display: block; }
    .wrap { width: min(1320px, calc(100vw - 28px)); margin: 0 auto; padding: 22px 0 30px; }
    .glass {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      border-radius: var(--radius);
    }
    .hero-title { font-size: clamp(30px, 4vw, 52px); font-weight: 900; letter-spacing: 2px; margin: 0; }
    .subtitle { color: var(--muted); line-height: 1.75; }
    .tag, .pill {
      display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.08); color: var(--muted); font-size: 13px;
    }
    .tag { color: var(--accent-2); }
    .start-layout { display: grid; grid-template-columns: 1.05fr .95fr; gap: 22px; align-items: start; margin-top: 22px; }
    .hero-banner { padding: 26px; min-height: 300px; display: flex; flex-direction: column; justify-content: space-between; }
    .control-card { padding: 22px; }
    .rules-box, .group-box {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      margin-top: 12px;
    }
    .mode-grid, .hero-grid, .setup-grid, .player-grid { display: grid; gap: 14px; }
    .mode-grid { grid-template-columns: repeat(2, 1fr); margin-top: 14px; }
    .mode-btn {
      text-align: left; padding: 18px; border-radius: 20px; background: rgba(255,255,255,0.06);
      border: 1px solid var(--line); cursor: pointer; transition: .15s ease;
    }
    .mode-btn.active, .hero-card.selected, .player-panel.current { outline: 2px solid rgba(124,156,255,0.9); background: rgba(124,156,255,0.12); }
    .mode-btn strong { display: block; font-size: 18px; margin-bottom: 8px; }
    .setup-grid { grid-template-columns: 1fr 1fr; margin-top: 16px; }
    .hero-grid { grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); margin-top: 12px; }
    .hero-card {
      padding: 16px; border-radius: 18px; background: rgba(255,255,255,0.05); border: 1px solid var(--line);
      min-height: 146px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; transition: .15s ease;
    }
    .hero-card:hover { transform: translateY(-2px); }
    .hero-card h4 { margin: 0 0 8px; font-size: 19px; }
    .hero-card p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .mini-actions { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin-top: 10px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .topbar .right { display: flex; gap: 10px; flex-wrap: wrap; }
    .board-layout { display: grid; grid-template-columns: 360px 1fr; gap: 16px; align-items: start; }
    .center-panel { padding: 18px; position: sticky; top: 14px; }
    .action-box { border-radius: 20px; padding: 16px; background: rgba(255,255,255,0.05); border: 1px solid var(--line); margin-bottom: 14px; }
    .action-seq, .skill-list { display: grid; gap: 10px; }
    .seq-item, .skill-item { border-radius: 16px; background: rgba(255,255,255,0.04); border: 1px solid var(--line); padding: 12px 14px; color: var(--muted); }
    .selected-summary { min-height: 74px; display: grid; gap: 6px; color: var(--muted); }
    .log { overflow: auto; border-radius: 18px; background: rgba(0,0,0,0.14); border: 1px solid var(--line); padding: 12px; height: 300px; }
    .log-entry { border-bottom: 1px dashed rgba(255,255,255,0.08); padding: 10px 0; line-height: 1.6; color: #d8dfff; font-size: 14px; }
    .log-entry:last-child { border-bottom: 0; }
    .player-grid { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
    .player-panel { padding: 16px; min-height: 300px; position: relative; }
    .player-panel.dead { opacity: .42; }
    .player-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
    .player-head h3 { margin: 0; font-size: 22px; }
    .hero-name { color: var(--accent-2); font-weight: 700; margin-top: 4px; }
    .status-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 10px; }
    .stats { color: var(--muted); display: grid; gap: 6px; font-size: 13px; }
    .hands { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
    .hand {
      min-height: 150px; border-radius: 24px; background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.04));
      border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
      position: relative; transition: .16s ease; user-select: none;
    }
    .hand.selectable { cursor: pointer; }
    .hand.selectable:hover { transform: translateY(-2px); }
    .hand.selected { outline: 3px solid rgba(246,211,101,0.95); background: linear-gradient(180deg, rgba(246,211,101,0.18), rgba(246,211,101,0.08)); }
    .label { color: var(--muted); font-size: 13px; }
    .digit { font-size: 60px; font-weight: 900; line-height: 1; }
    .hint { font-size: 12px; color: var(--muted); }
    .modal-wrap, .turn-overlay {
      position: fixed; inset: 0; background: rgba(7,10,18,0.76); display: none; align-items: center; justify-content: center;
      padding: 18px; z-index: 100; backdrop-filter: blur(7px);
    }
    .modal-wrap.show, .turn-overlay.show { display: flex; }
    .modal, .turn-card {
      width: min(840px, 100%); max-height: 88vh; overflow: auto; border-radius: 24px; padding: 24px;
      background: linear-gradient(180deg, rgba(23,29,48,0.98), rgba(16,21,36,0.98)); border: 1px solid var(--line); box-shadow: var(--shadow);
    }
    .modal p, .modal li { color: var(--muted); line-height: 1.8; }
    .actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
    .effect-options { display: grid; gap: 12px; margin-top: 14px; }
    .effect-card { border: 1px solid var(--line); border-radius: 18px; padding: 16px; background: rgba(255,255,255,0.05); cursor: pointer; transition: .15s ease; }
    .effect-card:hover { transform: translateY(-1px); }
    .effect-card strong { display: block; margin-bottom: 8px; }
    .tiny { font-size: 12px; color: var(--muted); }
    @media (max-width: 1080px) { .start-layout, .board-layout { grid-template-columns: 1fr; } .center-panel { position: static; } }
  </style>
</head>
<body>
  <section id="startScreen" class="screen active">
    <div class="wrap">
      <div class="start-layout">
        <div class="hero-banner glass">
          <div>
            <span class="tag">简洁 UI · 碰数核心 · 2~6 人</span>
            <h1 class="hero-title">碰数</h1>
            <p class="subtitle">碰数仍然占据核心：选自己的手，再点目标玩家的一只手，碰完立刻弹窗选择触发效果。现在支持 2 到 6 人，单机模式可 1 人对多个 AI，本地多人可同屏轮流操作。</p>
          </div>
          <div class="rules-box">
            <strong>当前版本要点</strong>
            <p style="margin:10px 0 0">每人初始双手 1 / 1，生命 6。每回合只碰一次。单数字 4 获得护盾，5/8/0 造成伤害，6 回复生命；双数字消耗 2 能量。部分英雄会把 1、3、93 这样的数字也变成特殊招式。</p>
          </div>
        </div>
        <div class="control-card glass">
          <h2 style="margin:0">开始游戏</h2>
          <div class="mode-grid" id="modeGrid"></div>
          <div class="setup-grid">
            <div class="group-box">
              <div class="pill">人数</div>
              <div style="margin-top:10px">
                <select id="playerCountSelect">
                  <option value="2">2 人</option>
                  <option value="3">3 人</option>
                  <option value="4">4 人</option>
                  <option value="5">5 人</option>
                  <option value="6">6 人</option>
                </select>
              </div>
            </div>
            <div class="group-box">
              <div class="pill">操作</div>
              <div style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;">
                <button id="showRulesBtn" class="secondary">规则介绍</button>
                <button id="showAllHeroesBtn" class="secondary">查看全部英雄</button>
              </div>
            </div>
          </div>
          <div id="selectionArea" style="margin-top:18px"></div>
        </div>
      </div>
    </div>
  </section>

  <section id="gameScreen" class="screen">
    <div class="wrap">
      <div class="topbar">
        <div class="pill" id="turnInfo">回合开始</div>
        <div class="right">
          <button id="ingameRulesBtn" class="secondary">查看规则</button>
          <button id="ingameSkillsBtn" class="secondary">查看技能</button>
          <button id="restartBtn" class="ghost">返回初始界面</button>
        </div>
      </div>
      <div class="board-layout">
        <div id="centerPanel" class="center-panel glass"></div>
        <div id="playerGrid" class="player-grid"></div>
      </div>
    </div>
  </section>

  <div id="modalWrap" class="modal-wrap"><div id="modalContent" class="modal"></div></div>
  <div id="turnOverlay" class="turn-overlay">
    <div class="turn-card">
      <h2 id="turnOverlayTitle">轮到玩家</h2>
      <p id="turnOverlayDesc" class="subtitle" style="margin-top:0"></p>
      <button id="turnOverlayBtn">开始操作</button>
    </div>
  </div>

  <script>
    const MAX_HP = 12; // 6 血，单位为 0.5
    const MAX_ENERGY = 2;

    const HEROES = [
      { id:'benzhen', name:'本真', title:'无修饰的原点', short:'无视其他英雄额外效果。', skills:['不受其他英雄技能带来的额外效果影响。基础数字效果仍正常生效。'], passiveFlags:{ immuneHeroEffects:true } },
      { id:'jibao', name:'纪宝', title:'存着再扛', short:'碰出 1 就攒脂肪，挨打自动减伤。', skills:['当你碰出 1 时，获得 1 层脂肪（最多 2）。','当你受到伤害时，若有脂肪，则自动消耗 1 层，使本次伤害 -0.5。'] },
      { id:'sunlinlin', name:'孙琳琳', title:'一点就打', short:'1 可以直接造成 1 伤害。', skills:['当你碰出 1 时，可额外选择：对任意目标造成 1 伤害。'] },
      { id:'dabaili', name:'大白梨', title:'耐打但不赖', short:'每轮第一次受伤 -0.5，最低仍吃 0.5。', skills:['每轮你第一次受到伤害时，本次伤害 -0.5；若原伤害大于 0，则最低仍会受到 0.5。'] },
      { id:'wangyucheng', name:'王煜程', title:'死而再起', short:'首次死亡后以 3 血和 5/5 复活一次。', skills:['你首次死亡时，改为以 3 生命复活，并将左右手重置为 5 / 5。每局仅一次。'] },
      { id:'zengxinyu', name:'曾新宇', title:'盾多一点', short:'4 变成 1.5 护盾。', skills:['当你触发 4 时，改为获得 1.5 护盾。'] },
      { id:'shenlinlin', name:'申林林', title:'到处抬血', short:'6 可指定任意目标回血。', skills:['当你触发 6 时，可以指定任意目标回复 1 生命，并在其下回合再回复 0.5 生命。'] },
      { id:'mengdeer', name:'孟德尔', title:'九三重击', short:'93 可消耗 2 能量造成 2 伤害。', skills:['当你的双手组成 9 / 3 时，可消耗 2 能量，对任意目标造成 2 伤害。组合无顺序。'] },
      { id:'shizhicai', name:'史之才', title:'连段有甲', short:'双数字后给自己 0.5 护盾。', skills:['当你成功触发双数字后，额外获得 0.5 护盾。'] },
      { id:'ye', name:'爷', title:'越杀越狠', short:'每击杀 1 人，之后你的所有伤害永久 +1。', skills:['每当你击败一名玩家，你获得 1 层杀意；你的所有伤害永久 +1。'] },
      { id:'wuruofei', name:'武若飞', title:'逢回就甲', short:'每次回复生命都会获得 0.5 护盾。', skills:['每次你回复生命后，额外获得 0.5 护盾。'] },
      { id:'suguan', name:'宿管', title:'盯住一个人', short:'连续两次打同一目标时伤害 +0.5。', skills:['若你本次造成伤害的目标与上次相同，则本次伤害 +0.5。'] },
      { id:'wumingshi', name:'无名氏', title:'六中带刺', short:'6 治疗后再随机扎别人 0.5。', skills:['当你触发 6 并完成治疗后，随机对另一名存活玩家造成 0.5 伤害。'] },
      { id:'wangdan', name:'王丹', title:'三点直伤', short:'3 可以直接造成 1 伤害。', skills:['当你碰出 3 时，可额外选择：对任意目标造成 1 伤害。'] },
      { id:'laotuqiang', name:'老土枪', title:'无视护盾', short:'你的伤害直接无视护盾。', skills:['你造成的伤害无视护盾，直接扣除目标生命。'] },
      { id:'cuixuejun', name:'崔学军', title:'挨打反扑', short:'受伤后下回合回 0.5，且伤害 +1。', skills:['当你受到伤害后，下回合开始时回复 0.5 生命，并获得反扑：你的下一次伤害 +1。'] }
    ];

    const MODE_OPTIONS = [
      { id:'single', name:'单机模式', desc:'你 + 其余 AI。人数越多越热闹。' },
      { id:'local', name:'本地多人', desc:'2~6 人同屏轮流操作，带换人遮罩。' }
    ];

    const state = {
      mode: 'single',
      setup: { playerCount: 2, heroIds: ['benzhen','jibao','sunlinlin','dabaili','wangyucheng','zengxinyu'] },
      game: null,
      selectedOwnHand: null,
      selectedTargetHand: null,
      swappedThisTurn: false,
      aiThinking: false,
    };

    const el = {
      startScreen: document.getElementById('startScreen'),
      gameScreen: document.getElementById('gameScreen'),
      modeGrid: document.getElementById('modeGrid'),
      playerCountSelect: document.getElementById('playerCountSelect'),
      selectionArea: document.getElementById('selectionArea'),
      modalWrap: document.getElementById('modalWrap'),
      modalContent: document.getElementById('modalContent'),
      playerGrid: document.getElementById('playerGrid'),
      centerPanel: document.getElementById('centerPanel'),
      turnInfo: document.getElementById('turnInfo'),
      turnOverlay: document.getElementById('turnOverlay'),
      turnOverlayTitle: document.getElementById('turnOverlayTitle'),
      turnOverlayDesc: document.getElementById('turnOverlayDesc'),
      turnOverlayBtn: document.getElementById('turnOverlayBtn'),
    };

    function heroById(id){ return HEROES.find(h => h.id === id); }
    function currentPlayer(){ return state.game.players[state.game.currentPlayerIndex]; }
    function alivePlayers(){ return state.game.players.filter(p => !p.dead); }
    function clone(x){ return JSON.parse(JSON.stringify(x)); }
    function hpText(v){ const full=Math.floor(v/2), half=v%2; return `${'❤️'.repeat(full)}${half?'💔':''} ${v/2}/${MAX_HP/2}`; }
    function shieldText(v){ return v ? v/2 : 0; }
    function log(text){ state.game?.log?.unshift({text, time:Date.now()}); }
    function switchScreen(which){ el.startScreen.classList.toggle('active', which==='start'); el.gameScreen.classList.toggle('active', which==='game'); }

    function showModal(html){ el.modalContent.innerHTML = html; el.modalWrap.classList.add('show'); }
    function closeModal(){ el.modalWrap.classList.remove('show'); el.modalContent.innerHTML=''; }
    window.closeModal = closeModal;
    el.modalWrap.addEventListener('click', e => { if(e.target===el.modalWrap) closeModal(); });

    function openHeroModal(heroId){
      const hero = heroById(heroId);
      showModal(`
        <h2>${hero.name}</h2>
        <p>${hero.title}</p>
        <div class="skill-list">${hero.skills.map((s,i)=>`<div class="skill-item"><strong>技能${i+1}</strong><div>${s}</div></div>`).join('')}</div>
        <div class="actions"><button onclick="closeModal()">关闭</button></div>
      `);
    }
    window.openHeroModal = openHeroModal;

    function openAllHeroesModal(){
      showModal(`
        <h2>全部英雄</h2>
        <div class="skill-list">
          ${HEROES.map(hero=>`
            <div class="skill-item">
              <strong>${hero.name}</strong>
              <div class="tiny" style="margin-bottom:8px">${hero.title}</div>
              <div>• ${hero.skills.join('</div><div style="margin-top:6px">• ')}</div>
            </div>
          `).join('')}
        </div>
        <div class="actions"><button onclick="closeModal()">关闭</button></div>
      `);
    }

    function openRulesModal(){
      showModal(`
        <h2>规则介绍</h2>
        <div class="rules-box"><strong>基础</strong><p>每人初始生命 6，左右手数字均为 1。每回合最多进行 1 次碰数，不能碰自己。你的手碰到别人某只手后，你自己的该手变为：<b>(自己的数 + 对方的数) 取个位数</b>。</p></div>
        <div class="rules-box"><strong>单数字效果</strong><p>4：立刻获得 1 护盾。<br>5 / 8 / 0：对任意目标造成 1 伤害。<br>6：立刻回复 1 生命，并在下回合再回复 0.5 生命。</p></div>
        <div class="rules-box"><strong>双数字效果</strong><p>当两只手组成以下任意组合时，可消耗 <b>2 能量</b> 触发其中一个：<br><b>55 / 98</b>：造成 2 伤害。<br><b>69 / 90</b>：造成 1 伤害并回复 1 生命。<br>部分英雄会额外拥有自己的专属数字或双数字效果，例如 1、3、93。组合无顺序要求。</p></div>
        <div class="rules-box"><strong>结算</strong><p>每回合开始自动获得 1 点能量，最多存 2 点。碰数后若满足多个效果，会弹窗供你选择，但只能触发 1 个效果。</p></div>
        <div class="rules-box"><strong>血量显示</strong><p>本作最小单位为 0.5。❤️ 代表 1 点生命，💔 代表 0.5 点生命。护盾也按 0.5 结算。</p></div>
        <div class="actions"><button onclick="closeModal()">我知道了</button></div>
      `);
    }

    function renderModeOptions(){
      el.modeGrid.innerHTML = MODE_OPTIONS.map(mode => `
        <div class="mode-btn ${state.mode===mode.id?'active':''}" data-mode="${mode.id}">
          <strong>${mode.name}</strong><div class="tiny">${mode.desc}</div>
        </div>
      `).join('');
      [...el.modeGrid.querySelectorAll('.mode-btn')].forEach(btn => btn.onclick = () => { state.mode = btn.dataset.mode; renderModeOptions(); renderSelectionArea(); });
    }

    function ensureHeroArrayLength(){
      while(state.setup.heroIds.length < 6) state.setup.heroIds.push(HEROES[state.setup.heroIds.length % HEROES.length].id);
    }

    function renderSelectionArea(){
      ensureHeroArrayLength();
      const n = state.setup.playerCount;
      const blocks = Array.from({length:n}, (_,i)=>{
        const label = i===0 ? '玩家1' : (state.mode==='single' ? `AI${i}` : `玩家${i+1}`);
        const chosen = state.setup.heroIds[i];
        return `
          <div class="group-box">
            <div class="pill">${label}</div>
            <div class="hero-grid">
              ${HEROES.map(hero => `
                <div class="hero-card ${chosen===hero.id?'selected':''}" data-slot="${i}" data-hero="${hero.id}">
                  <div><h4>${hero.name}</h4><p>${hero.short}</p></div>
                  <div class="mini-actions"><span class="pill">${label}</span><button class="ghost" data-viewhero="${hero.id}">技能</button></div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');

      el.selectionArea.innerHTML = `
        <div class="rules-box"><strong>英雄选择</strong><p style="margin:10px 0 0">英雄都压缩成简单效果。尽量一眼就知道自己想玩什么流派：稳、盾、残局、换位、追击、治疗。</p></div>
        ${blocks}
        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap;">
          <button id="randomHeroesBtn" class="secondary">随机全部英雄</button>
          <button id="startGameBtn">开始对局</button>
        </div>
      `;

      [...el.selectionArea.querySelectorAll('.hero-card')].forEach(card => {
        card.onclick = e => {
          if(e.target.closest('button')) return;
          state.setup.heroIds[Number(card.dataset.slot)] = card.dataset.hero;
          renderSelectionArea();
        };
      });
      [...el.selectionArea.querySelectorAll('[data-viewhero]')].forEach(btn => btn.onclick = () => openHeroModal(btn.dataset.viewhero));
      document.getElementById('randomHeroesBtn').onclick = () => {
        state.setup.heroIds = Array.from({length:n}, ()=>HEROES[Math.floor(Math.random()*HEROES.length)].id);
        renderSelectionArea();
      };
      document.getElementById('startGameBtn').onclick = startGame;
    }

    function createPlayer(name, heroId, isAI=false){
      return {
        name, heroId, isAI,
        hp: MAX_HP, maxHp: MAX_HP,
        hands: [1,1], shield: 0, energy: 0,
        pendingHeal: 0, pendingShield: 0, dead: false,
        fat: 0, damageBuff: 0, lastDamagedTargetIndex: null,
        firstDamageReducedAvailable: false,
        firstHealShieldAvailable: false,
        reviveUsed: false, killStacks: 0, pendingNextTurnDamageBuff: 0,
      };
    }

    function startGame(){
      state.game = { turn: 1, currentPlayerIndex: 0, players: [], log: [], winner: null };
      state.selectedOwnHand = null;
      state.selectedTargetHand = null;
      state.swappedThisTurn = false;
      state.aiThinking = false;
      const n = state.setup.playerCount;
      for(let i=0;i<n;i++){
        const name = i===0 ? '玩家1' : (state.mode==='single' ? `AI${i}` : `玩家${i+1}`);
        const isAI = state.mode==='single' && i>0;
        state.game.players.push(createPlayer(name, state.setup.heroIds[i], isAI));
        log(`${name} 选择了【${heroById(state.setup.heroIds[i]).name}】。`);
      }
      switchScreen('game');
      beginTurn();
    }

    function nextAliveIndex(from){
      const len = state.game.players.length;
      for(let i=1;i<=len;i++){
        const idx = (from + i) % len;
        if(!state.game.players[idx].dead) return idx;
      }
      return from;
    }

    function beginTurn(){
      if(state.game.winner) return;
      state.selectedOwnHand = null;
      state.selectedTargetHand = null;
      state.swappedThisTurn = false;
      const p = currentPlayer();
      if(p.dead){ endTurn(); return; }
      p.energy = Math.min(MAX_ENERGY, p.energy + 1);
      p.firstDamageReducedAvailable = heroById(p.heroId).id === 'dabaili';
      p.firstHealShieldAvailable = heroById(p.heroId).id === 'wuruofei';
      if(p.pendingShield > 0){ gainShield(p, p.pendingShield, `${p.name} 的延迟护盾生效，获得 {shield} 护盾。`, false); p.pendingShield = 0; }
      if(p.pendingHeal > 0){ healPlayer(p, p.pendingHeal, `${p.name} 的延迟回复生效，回复 ${p.pendingHeal/2} 生命。`, false); p.pendingHeal = 0; }
      if(p.pendingNextTurnDamageBuff > 0){ p.damageBuff += p.pendingNextTurnDamageBuff; log(`【崔学军】反扑生效，下一次伤害 +${p.pendingNextTurnDamageBuff/2}。`); p.pendingNextTurnDamageBuff = 0; }
      log(`轮到 ${p.name}。获得 1 能量。`);
      renderGame();
      if(state.mode==='local') showTurnOverlay(`${p.name} 的回合`, `请由 ${p.name} 操作。其他人先别看。`);
      else if(p.isAI) runAI();
    }

    function showTurnOverlay(title, desc){ el.turnOverlayTitle.textContent = title; el.turnOverlayDesc.textContent = desc; el.turnOverlay.classList.add('show'); }
    el.turnOverlayBtn.onclick = () => { el.turnOverlay.classList.remove('show'); if(currentPlayer().isAI && !state.aiThinking) runAI(); };

    function endTurn(){
      if(checkWinner()) return;
      state.game.currentPlayerIndex = nextAliveIndex(state.game.currentPlayerIndex);
      state.game.turn += 1;
      beginTurn();
    }

    function checkWinner(){
      const alive = alivePlayers();
      if(alive.length <= 1){
        state.game.winner = alive[0] || null;
        renderGame();
        showModal(`
          <h2>${alive[0] ? `${alive[0].name} 获胜！` : '对局结束'}</h2>
          <p>${alive[0] ? `英雄：${heroById(alive[0].heroId).name}` : ''}</p>
          <div class="actions"><button onclick="closeModal();switchToStart()">回到初始界面</button></div>
        `);
        return true;
      }
      return false;
    }
    window.switchToStart = () => { closeModal(); switchScreen('start'); };

    function healPlayer(player, amountHalf, reason, isHeroModified=true){
      if(heroById(player.heroId).passiveFlags?.immuneHeroEffects && isHeroModified) {
        log(`【本真】无视了英雄带来的额外治疗。`); return 0;
      }
      const before = player.hp;
      player.hp = Math.min(player.maxHp, player.hp + amountHalf);
      const real = player.hp - before;
      if(real > 0 && reason) log(reason);
      if(real > 0 && heroById(player.heroId).id === 'wuruofei'){
        gainShield(player, 1, `【武若飞】回复后获得 {shield} 护盾。`, true);
      }
      return real;
    }

    function gainShield(player, amountHalf, reason, isHeroModified=true){
      if(heroById(player.heroId).passiveFlags?.immuneHeroEffects && isHeroModified) {
        log(`【本真】无视了英雄额外护盾。`); return 0;
      }
      let add = amountHalf;
      if(heroById(player.heroId).id === 'zengxinyu' && amountHalf === 2) add = 3;
      player.shield += add;
      if(reason) log(reason.replace('{shield}', add/2));
      return add;
    }

    function applyDamage(source, target, amountHalf, reason, isHeroModified=false, sourceType=''){
      if(target.dead || amountHalf <= 0) return 0;
      if(heroById(target.heroId).passiveFlags?.immuneHeroEffects && isHeroModified){
        log(`【本真】无视了英雄额外效果。`);
        isHeroModified = false;
      }
      let damage = amountHalf;
      if(heroById(target.heroId).id === 'jibao' && target.fat > 0){
        target.fat -= 1; damage = Math.max(0, damage - 1); log(`${target.name} 消耗 1 层脂肪，使伤害 -0.5。`);
      }
      if(heroById(target.heroId).id === 'dabaili' && target.firstDamageReducedAvailable){
        target.firstDamageReducedAvailable = false; damage = Math.max(1, damage - 1); log(`【大白梨】使本次伤害 -0.5，但最低仍会受到 0.5。`);
      }
      let absorbed = 0;
      const ignoreShield = source && heroById(source.heroId).id === 'laotuqiang';
      if(target.shield > 0 && damage > 0 && !ignoreShield){ absorbed = Math.min(target.shield, damage); target.shield -= absorbed; damage -= absorbed; }
      target.hp = Math.max(0, target.hp - damage);
      if(reason){ const extra = absorbed>0 ? `（护盾抵挡 ${absorbed/2}）` : (ignoreShield && target.shield>0 ? '（无视护盾）' : ''); log(`${reason}${extra}`); }
      if(source && damage > 0) source.lastDamagedTargetIndex = state.game.players.indexOf(target);
      if(damage > 0 && heroById(target.heroId).id === 'cuixuejun'){ target.pendingHeal = Math.min(2, target.pendingHeal + 1); target.pendingNextTurnDamageBuff += 2; log(`【崔学军】将在下回合开始时回复 0.5 生命，且下一次伤害 +1。`); }
      if(target.hp <= 0){
        if(heroById(target.heroId).id === 'wangyucheng' && !target.reviveUsed){
          target.reviveUsed = true; target.dead = false; target.hp = 6; target.hands = [5,5]; target.shield = 0; log(`【王煜程】首次死亡后原地复活，恢复到 3 生命，双手变为 5 / 5。`);
        } else {
          target.dead = true; log(`${target.name} 被击败。`);
          if(source && heroById(source.heroId).id === 'ye'){ source.killStacks += 1; log(`【爷】完成击杀，之后你的所有伤害永久 +${source.killStacks}。`); }
        }
      }
      return damage;
    }

    function getComboType(hands){
      const sorted = [...hands].sort((a,b)=>a-b).join('');
      if(sorted === '55' || sorted === '89') return 'doubleDamage';
      if(sorted === '69' || sorted === '09') return 'damageAndHeal';
      if(sorted === '39') return 'meng93';
      return null;
    }

    function triggerOptionsForPlayer(player, changedDigit){
      const options = [];
      if(changedDigit === 4) options.push({ type:'single-4', label:'单数字 4', desc:'立刻获得 1 护盾。' });
      if([5,8,0].includes(changedDigit)) options.push({ type:`single-${changedDigit}`, label:`单数字 ${changedDigit}`, desc:'对任意目标造成 1 伤害。' });
      if(changedDigit === 1 && heroById(player.heroId).id === 'sunlinlin') options.push({ type:'single-1', label:'孙琳琳 · 1', desc:'对任意目标造成 1 伤害。' });
      if(changedDigit === 3 && heroById(player.heroId).id === 'wangdan') options.push({ type:'single-3', label:'王丹 · 3', desc:'对任意目标造成 1 伤害。' });
      if(changedDigit === 6) options.push({ type:'single-6', label:'单数字 6', desc:'回复 1 生命，并在下回合再回复 0.5 生命。' });
      const combo = getComboType(player.hands);
      if(combo && player.energy >= 2){
        if(combo === 'doubleDamage') options.push({ type:'combo-doubleDamage', label:'双数字组合', desc:'消耗 2 能量：造成 2 伤害。' });
        if(combo === 'damageAndHeal') options.push({ type:'combo-damageAndHeal', label:'双数字组合', desc:'消耗 2 能量：造成 1 伤害并回复 1 生命。' });
        if(combo === 'meng93' && heroById(player.heroId).id === 'mengdeer') options.push({ type:'combo-meng93', label:'孟德尔 93', desc:'消耗 2 能量：造成 2 伤害。' });
      }
      return options;
    }

    function buildDamageAmount(player, target, baseHalf, sourceType){
      let dmg = baseHalf, heroBoost = false;
      const heroId = heroById(player.heroId).id;
      if(heroId === 'ye' && player.killStacks > 0){ dmg += player.killStacks * 2; heroBoost = true; log(`【爷】杀意叠加，使本次伤害 +${player.killStacks}。`); }
      if(heroId === 'suguan' && player.lastDamagedTargetIndex === state.game.players.indexOf(target)){ dmg += 1; heroBoost = true; log(`【宿管】连续压制同一目标，伤害 +0.5。`); }
      if(player.damageBuff > 0){ dmg += player.damageBuff; heroBoost = true; const add = player.damageBuff; player.damageBuff = 0; log(`伤害强化生效，使本次伤害 +${add/2}。`); }
      return { dmg, heroBoost };
    }

    function evaluateThreatScore(player, perspective=null){
      if(!player || player.dead) return -9999;
      let score = 0;
      score += player.hp * 0.55;
      score += player.shield * 0.45;
      score += player.energy * 1.1;
      const combo = getComboType(player.hands);
      if(combo && player.energy >= 2) score += 3.5;
      if(player.hands.includes(5) || player.hands.includes(8) || player.hands.includes(0)) score += 1.2;
      if(player.hands.includes(6)) score += 0.8;
      if(heroById(player.heroId).id === 'ye') score += player.killStacks * 3;
      if(heroById(player.heroId).id === 'wangyucheng' && !player.reviveUsed) score += 2.5;
      if(heroById(player.heroId).id === 'laotuqiang') score += 1.5;
      if(heroById(player.heroId).id === 'shenlinlin') score += 0.8;
      if(heroById(player.heroId).id === 'mengdeer') score += 0.8;
      if(perspective && player === perspective.lastDamagedTarget) score += 0.6;
      return score;
    }

    function pickAiTarget(candidates, ai, mode='damage'){
      if(!candidates.length) return null;
      const scored = candidates
        .filter(p => p && !p.dead && p !== ai)
        .map(target => {
          let score = evaluateThreatScore(target, ai);
          if(mode === 'heal'){
            score = (target.maxHp - target.hp) * 1.6 + (target === ai ? 0.7 : 0) + target.pendingHeal * 0.2;
            if(heroById(target.heroId).id === 'ye' && target.killStacks > 0) score += 0.8;
          } else {
            if(target.hp <= 4) score += 1.6;
            if(target.hp <= 2) score += 1.8;
            if(target.shield === 0) score += 0.4;
          }
          return { target, score };
        })
        .sort((a,b) => b.score - a.score);
      return scored[0]?.target || null;
    }

    function chooseTargetModal(title, desc, cb, filterFn=null, mode='damage'){
      const candidates = state.game.players.filter((p, idx) => !p.dead && (!filterFn || filterFn(p, idx)));
      const actor = currentPlayer();
      if(actor && actor.isAI){
        const autoTarget = pickAiTarget(candidates, actor, mode);
        if(autoTarget){ cb(autoTarget); return; }
      }
      showModal(`
        <h2>${title}</h2><p>${desc}</p>
        <div class="effect-options">
          ${candidates.map((p, idx) => `<div class="effect-card" data-target-idx="${idx}"><strong>${p.name}</strong><div>英雄：${heroById(p.heroId).name} · 血量：${p.hp/2} · 护盾：${p.shield/2}</div></div>`).join('')}
        </div>
      `);
      [...el.modalContent.querySelectorAll('[data-target-idx]')].forEach(node => {
        node.onclick = () => { const target = candidates[Number(node.dataset.targetIdx)]; closeModal(); cb(target); };
      });
    }

    function finishTurnPassives(player){
    }

    function resolveEffect(player, effect){
      const heroId = heroById(player.heroId).id;
      if(effect.type === 'single-4'){
        gainShield(player, 2, `${player.name} 获得 {shield} 护盾。`, false);
        finishTurnPassives(player); renderGame(); setTimeout(endTurn, 220); return;
      }
      if(['single-5','single-8','single-0','single-1','single-3'].includes(effect.type)){
        chooseTargetModal('选择伤害目标', '请选择要受到伤害的玩家。', target => {
          const built = buildDamageAmount(player, target, 2, effect.type);
          applyDamage(player, target, built.dmg, `${player.name} 触发 ${effect.type.slice(-1)}，对 ${target.name} 造成 ${built.dmg/2} 伤害。`, built.heroBoost, effect.type);
          finishTurnPassives(player); renderGame(); setTimeout(endTurn, 220);
        }, (_, idx) => idx !== state.game.currentPlayerIndex);
        return;
      }
      if(effect.type === 'single-6'){
        const doHeal = (target) => {
          healPlayer(target, 2, `${player.name} 触发 6，使 ${target.name} 立刻回复 1 生命。`, false);
          target.pendingHeal += 1;
          log(`${target.name} 获得 0.5 延迟回复。`);
          if(heroId === 'wumingshi'){
            const others = state.game.players.filter(p => !p.dead && p !== target && p !== player);
            if(others.length){
              const randomTarget = others[Math.floor(Math.random()*others.length)];
              applyDamage(player, randomTarget, 1, `【无名氏】顺手刺了 ${randomTarget.name} 一下，造成 0.5 伤害。`, true, 'hero-wumingshi');
            }
          }
          finishTurnPassives(player); renderGame(); setTimeout(endTurn, 220);
        };
        if(heroId === 'shenlinlin') chooseTargetModal('选择回复目标', '【申林林】可以让任意目标吃到 6 的回复。', doHeal, null, 'heal');
        else doHeal(player);
        return;
      }
      if(effect.type === 'combo-doubleDamage'){
        player.energy -= 2;
        chooseTargetModal('选择组合伤害目标', '消耗 2 能量，造成 2 伤害。', target => {
          const built = buildDamageAmount(player, target, 4, effect.type);
          applyDamage(player, target, built.dmg, `${player.name} 触发双数字组合，对 ${target.name} 造成 ${built.dmg/2} 伤害。`, built.heroBoost, effect.type);
          if(heroId === 'shizhicai') gainShield(player, 1, `【史之才】双数字后获得 {shield} 护盾。`, true);
          finishTurnPassives(player); renderGame(); setTimeout(endTurn, 220);
        }, (_, idx) => idx !== state.game.currentPlayerIndex);
        return;
      }
      if(effect.type === 'combo-damageAndHeal'){
        player.energy -= 2;
        chooseTargetModal('选择组合目标', '消耗 2 能量，造成 1 伤害并回复 1 生命。', target => {
          const built = buildDamageAmount(player, target, 2, effect.type);
          applyDamage(player, target, built.dmg, `${player.name} 触发双数字组合，对 ${target.name} 造成 ${built.dmg/2} 伤害。`, built.heroBoost, effect.type);
          healPlayer(player, 2, `${player.name} 因双数字组合回复 1 生命。`, false);
          if(heroId === 'shizhicai') gainShield(player, 1, `【史之才】双数字后获得 {shield} 护盾。`, true);
          finishTurnPassives(player); renderGame(); setTimeout(endTurn, 220);
        }, (_, idx) => idx !== state.game.currentPlayerIndex);
      }

      if(effect.type === 'combo-meng93'){
        player.energy -= 2;
        chooseTargetModal('选择 93 目标', '消耗 2 能量，造成 2 伤害。', target => {
          const built = buildDamageAmount(player, target, 4, effect.type);
          applyDamage(player, target, built.dmg, `【孟德尔】93 触发，对 ${target.name} 造成 ${built.dmg/2} 伤害。`, built.heroBoost, effect.type);
          finishTurnPassives(player); renderGame(); setTimeout(endTurn, 220);
        }, (_, idx) => idx !== state.game.currentPlayerIndex);
      }
    }

    function openEffectChoiceModal(player, options){
      showModal(`
        <h2>选择要触发的效果</h2>
        <p>本次碰数可触发以下效果，你只能选择 1 个。</p>
        <div class="effect-options">
          ${options.map((op, idx) => `<div class="effect-card" data-effect-idx="${idx}"><strong>${op.label}</strong><div>${op.desc}</div></div>`).join('')}
          <div class="effect-card" data-effect-idx="skip"><strong>不触发</strong><div>本次不使用任何效果，直接结束回合。</div></div>
        </div>
      `);
      [...el.modalContent.querySelectorAll('[data-effect-idx]')].forEach(node => {
        node.onclick = () => {
          const idx = node.dataset.effectIdx; closeModal();
          if(idx === 'skip'){ finishTurnPassives(player); setTimeout(endTurn, 220); }
          else resolveEffect(player, options[Number(idx)]);
        };
      });
    }

    function performAction(ownIndex, targetIndex, ownHandIndex, targetHandIndex){
      const player = state.game.players[ownIndex], target = state.game.players[targetIndex];
      if(player.dead || target.dead) return;
      const oldOwn = player.hands[ownHandIndex], targetDigit = target.hands[targetHandIndex], result = (oldOwn + targetDigit) % 10;
      player.hands[ownHandIndex] = result;
      log(`${player.name} 用自己的${ownHandIndex===0?'左手':'右手'} ${oldOwn} 碰了 ${target.name} 的${targetHandIndex===0?'左手':'右手'} ${targetDigit}，变成了 ${result}。`);
      if(heroById(player.heroId).id === 'jibao' && result === 1){ player.fat = Math.min(2, player.fat + 1); log(`【纪宝】获得 1 层脂肪。当前脂肪：${player.fat}`); }
      renderGame();
      const options = triggerOptionsForPlayer(player, result);
      if(!options.length){ finishTurnPassives(player); setTimeout(endTurn, 220); }
      else openEffectChoiceModal(player, options);
    }

    function handleHandClick(playerIdx, handIdx){
      const p = currentPlayer();
      if(p.isAI || state.game.winner) return;
      if(playerIdx === state.game.currentPlayerIndex){ state.selectedOwnHand = { playerIdx, handIdx }; renderGame(); return; }
      if(!state.selectedOwnHand) return;
      state.selectedTargetHand = { playerIdx, handIdx };
      renderGame();
      performAction(state.game.currentPlayerIndex, playerIdx, state.selectedOwnHand.handIdx, handIdx);
    }

    function renderPlayerPanel(player, idx){
      const hero = heroById(player.heroId), isCurrent = state.game.currentPlayerIndex === idx;
      const selectedOwn = state.selectedOwnHand?.playerIdx === idx ? state.selectedOwnHand.handIdx : null;
      const selectedTarget = state.selectedTargetHand?.playerIdx === idx ? state.selectedTargetHand.handIdx : null;
      return `
        <div class="player-panel glass ${isCurrent?'current':''} ${player.dead?'dead':''}">
          <div class="player-head">
            <div><h3>${player.name}</h3><div class="hero-name">${hero.name}</div></div>
            <button class="secondary" onclick="openHeroModal('${hero.id}')">技能</button>
          </div>
          <div class="status-row">
            <span class="pill">血量：${hpText(player.hp)}</span>
            <span class="pill">盾：${shieldText(player.shield)}</span>
            <span class="pill">能量：${player.energy}/${MAX_ENERGY}</span>
            ${hero.id === 'jibao' ? `<span class="pill">脂肪：${player.fat}/2</span>` : ''}
            ${player.damageBuff ? `<span class="pill">伤害强化：+${player.damageBuff/2}</span>` : ''}
            ${player.killStacks ? `<span class="pill">杀意：${player.killStacks}</span>` : ''}
            ${hero.id === 'wangyucheng' ? `<span class="pill">复活：${player.reviveUsed ? '已用' : '可用'}</span>` : ''}
          </div>
          <div class="stats">
            <div>${hero.short}</div>
            ${player.pendingHeal ? `<div>下回合回复：${player.pendingHeal/2}</div>` : ''}
            ${player.pendingShield ? `<div>下回合护盾：${player.pendingShield/2}</div>` : ''}
          </div>
          <div class="hands">
            ${player.hands.map((digit, handIdx) => {
              const selectable = !player.dead && !currentPlayer().isAI && !state.game.winner && (idx === state.game.currentPlayerIndex || idx !== state.game.currentPlayerIndex);
              const selected = selectedOwn === handIdx || selectedTarget === handIdx;
              return `
                <div class="hand ${selectable?'selectable':''} ${selected?'selected':''}" data-playeridx="${idx}" data-handidx="${handIdx}">
                  <div class="label">${handIdx===0?'左手':'右手'}</div>
                  <div class="digit">${digit}</div>
                  <div class="hint">${idx===state.game.currentPlayerIndex?'可作为自己的手':'可作为目标手'}</div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderCenterPanel(){
      const p = currentPlayer();
      const ownHandText = state.selectedOwnHand ? `${state.selectedOwnHand.handIdx===0?'左手':'右手'} ${p.hands[state.selectedOwnHand.handIdx]}` : '未选择';
      const targetText = state.selectedTargetHand ? `${state.game.players[state.selectedTargetHand.playerIdx].name} 的${state.selectedTargetHand.handIdx===0?'左手':'右手'} ${state.game.players[state.selectedTargetHand.playerIdx].hands[state.selectedTargetHand.handIdx]}` : '未选择';
      const hero = heroById(p.heroId);
      const canSwap = false;
      el.centerPanel.innerHTML = `
        <div class="action-box">
          <h3 style="margin-top:0">当前操作</h3>
          <div class="selected-summary">
            <div>当前玩家：<b>${p.name}</b>（${hero.name}）</div>
            <div>自己的手：<b>${ownHandText}</b></div>
            <div>目标的手：<b>${targetText}</b></div>
          </div>
          <div class="action-seq">
            <div class="seq-item">① 先点自己的左手或右手</div>
            <div class="seq-item">② 再点其他任意存活玩家的一只手</div>
            <div class="seq-item">③ 碰数后弹窗选择触发效果</div>
          </div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;">
            ${canSwap ? '<button id="swapHandsBtn" class="secondary">交换左右手</button>' : ''}
            <button id="skipTurnBtn" class="ghost">跳过回合</button>
          </div>
        </div>
        <div class="action-box">
          <h3 style="margin-top:0">本局信息</h3>
          <div class="skill-list">
            <div class="skill-item">回合数：${state.game.turn}</div>
            <div class="skill-item">存活人数：${alivePlayers().length}</div>
            <div class="skill-item">双数字消耗：2 能量</div>
          </div>
        </div>
        <div class="action-box">
          <h3 style="margin-top:0">对局记录</h3>
          <div class="log">${state.game.log.map(item=>`<div class="log-entry">${item.text}</div>`).join('')}</div>
        </div>
      `;
      const swapBtn = document.getElementById('swapHandsBtn');
      if(swapBtn) swapBtn.onclick = () => { [p.hands[0], p.hands[1]] = [p.hands[1], p.hands[0]]; state.swappedThisTurn = true; log(`【孟德尔】交换了左右手。`); renderGame(); };
      document.getElementById('skipTurnBtn').onclick = () => { log(`${p.name} 选择跳过回合。`); endTurn(); };
    }

    function renderGame(){
      if(!state.game) return;
      const p = currentPlayer();
      el.turnInfo.textContent = `第 ${state.game.turn} 回合 · 当前：${p.name} · 英雄：${heroById(p.heroId).name}`;
      el.playerGrid.innerHTML = state.game.players.map((player, idx)=>renderPlayerPanel(player, idx)).join('');
      [...el.playerGrid.querySelectorAll('.hand')].forEach(node => node.onclick = () => handleHandClick(Number(node.dataset.playeridx), Number(node.dataset.handidx)));
      renderCenterPanel();
    }

    function openIngameSkillsModal(){
      showModal(`
        <h2>本局英雄技能</h2>
        <div class="skill-list">
          ${state.game.players.map(p => `<div class="skill-item"><strong>${p.name} · ${heroById(p.heroId).name}</strong><div style="margin-top:8px">• ${heroById(p.heroId).skills.join('</div><div style="margin-top:6px">• ')}</div></div>`).join('')}
        </div>
        <div class="actions"><button onclick="closeModal()">关闭</button></div>
      `);
    }

    function runAI(){
      const ai = currentPlayer();
      if(!ai.isAI || state.aiThinking) return;
      state.aiThinking = true;
      const candidates = [];
      state.game.players.forEach((target, targetIdx) => {
        if(target.dead || targetIdx === state.game.currentPlayerIndex) return;
        ai.hands.forEach((ownDigit, ownHandIdx) => {
          target.hands.forEach((targetDigit, targetHandIdx) => {
            const result = (ownDigit + targetDigit) % 10;
            let score = 0;
            if([5,8,0].includes(result)) score += 4;
            if(result === 6) score += (ai.hp < ai.maxHp ? 3 : 1);
            if(result === 4) score += (ai.shield === 0 ? 2.5 : 1);
            const testHands = clone(ai.hands); testHands[ownHandIdx] = result;
            const combo = getComboType(testHands);
            if(combo && ai.energy >= 2) score += combo === 'doubleDamage' ? 6 : 5;
            score += evaluateThreatScore(target, ai) * 0.75;
            if(target.hp <= 4) score += 1.5;
            if(target.hp <= 2) score += 1.2;
            score += Math.random() * 0.35;
            candidates.push({ targetIdx, ownHandIdx, targetHandIdx, score });
          });
        });
      });
      candidates.sort((a,b)=>b.score-a.score);
      const move = candidates[0];
      setTimeout(() => {
        performAction(state.game.currentPlayerIndex, move.targetIdx, move.ownHandIdx, move.targetHandIdx);
        setTimeout(() => {
          const player = ai;
          const options = triggerOptionsForPlayer(player, player.hands[move.ownHandIdx]);
          if(options.length){
            let chosen = options.find(op => op.type.startsWith('combo')) || options.find(op => ['single-5','single-8','single-0','single-6','single-4'].includes(op.type));
            if(chosen){ closeModal(); resolveEffect(player, chosen); }
          }
          state.aiThinking = false;
        }, 120);
      }, 480);
    }

    document.getElementById('showRulesBtn').onclick = openRulesModal;
    document.getElementById('showAllHeroesBtn').onclick = openAllHeroesModal;
    document.getElementById('ingameRulesBtn').onclick = openRulesModal;
    document.getElementById('ingameSkillsBtn').onclick = openIngameSkillsModal;
    document.getElementById('restartBtn').onclick = () => switchScreen('start');
    el.playerCountSelect.onchange = () => { state.setup.playerCount = Number(el.playerCountSelect.value); renderSelectionArea(); };

    renderModeOptions();
    renderSelectionArea();
  </script>
</body>
</html>
