<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>碰数</title>
<style>
:root{--bg:#0f1220;--panel:rgba(24,29,48,.9);--panel2:rgba(31,37,61,.96);--line:rgba(255,255,255,.11);--text:#eef2ff;--muted:#aeb6d9;--gold:#f6d365;--accent:#7c9cff;--accent2:#8cf6d9;--danger:#ff7a90;--success:#74f0a9;--shadow:0 18px 48px rgba(0,0,0,.35);--radius:22px}*{box-sizing:border-box}body{margin:0;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at top left,rgba(124,156,255,.18),transparent 28%),radial-gradient(circle at top right,rgba(140,246,217,.14),transparent 22%),linear-gradient(160deg,#090b14,#12172a 45%,#0d1020);min-height:100vh}button,select{border:0;border-radius:16px;padding:11px 16px;font-size:14px}button{cursor:pointer;background:linear-gradient(135deg,var(--gold),#ff9f7a);color:#141620;font-weight:800;box-shadow:0 10px 26px rgba(246,211,101,.18)}button.secondary{background:rgba(255,255,255,.09);color:var(--text);box-shadow:none;border:1px solid var(--line)}button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);box-shadow:none}button:disabled{opacity:.45;cursor:not-allowed}.screen{display:none}.screen.active{display:block}.wrap{width:min(1280px,calc(100% - 32px));margin:0 auto;padding:28px 0}.glass{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(14px);border-radius:var(--radius)}.start-layout{display:grid;grid-template-columns:1fr 1.18fr;gap:22px;align-items:start}.hero-banner,.control-card{padding:24px}.tag,.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--muted);font-size:12px}.hero-title{font-size:64px;line-height:1;margin:18px 0 10px;letter-spacing:-2px}.subtitle{color:var(--muted);line-height:1.75}.rules-box{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}.mode-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}.mode-btn,.hero-card,.effect-card,.team-card{border:1px solid var(--line);border-radius:18px;padding:14px;background:rgba(255,255,255,.05);cursor:pointer;transition:.15s}.mode-btn.active,.hero-card.selected,.team-card.selected{border-color:rgba(246,211,101,.8);background:linear-gradient(180deg,rgba(246,211,101,.17),rgba(255,255,255,.05))}.mode-btn:hover,.hero-card:hover,.effect-card:hover,.team-card:hover{transform:translateY(-1px)}.setup-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}.hero-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px;max-height:340px;overflow:auto;padding-right:4px}.hero-card h4{margin:0 0 7px}.hero-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}.mini-actions{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:10px}.player-setup{margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.035)}.team-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.team-card{padding:9px 12px;font-weight:800}.topbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}.right{display:flex;gap:10px;flex-wrap:wrap}.board-layout{display:grid;grid-template-columns:360px 1fr;gap:16px;align-items:start}.center-panel{padding:18px;position:sticky;top:16px;min-height:520px;display:flex;flex-direction:column;gap:14px}.player-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.player-panel{padding:16px;min-height:315px}.player-panel.current{outline:2px solid rgba(246,211,101,.72)}.player-panel.dead{opacity:.45;filter:grayscale(.45)}.player-head{display:flex;justify-content:space-between;align-items:start;gap:10px}.player-head h3{margin:0;font-size:21px}.hero-name{color:var(--accent2);font-size:13px;margin-top:5px}.status-row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.hands{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.hand{border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.06);padding:14px;text-align:center;user-select:none;transition:.15s}.hand.selectable{cursor:pointer}.hand.selectable:hover{transform:translateY(-2px)}.hand.selected{outline:3px solid rgba(246,211,101,.95);background:linear-gradient(180deg,rgba(246,211,101,.18),rgba(246,211,101,.08))}.hand .label,.hand .hint{color:var(--muted);font-size:12px}.hand .digit{font-size:58px;font-weight:900;line-height:1}.action-box{border-radius:20px;padding:16px;background:rgba(255,255,255,.05);border:1px solid var(--line)}.action-box h3{margin:0 0 10px}.selected-summary{min-height:78px;display:flex;flex-direction:column;gap:7px;color:var(--muted)}.action-seq{display:grid;gap:10px;margin-top:8px}.seq-item{border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line);padding:11px;color:var(--muted);font-size:14px}.log{flex:1;overflow:auto;border-radius:18px;background:rgba(0,0,0,.14);border:1px solid var(--line);padding:12px;min-height:210px}.log-entry{border-bottom:1px dashed rgba(255,255,255,.08);padding:9px 0;line-height:1.55;color:#d8dfff;font-size:14px}.log-entry:last-child{border-bottom:0}.modal-wrap{position:fixed;inset:0;background:rgba(7,10,18,.76);display:none;align-items:center;justify-content:center;padding:20px;z-index:100;backdrop-filter:blur(7px)}.modal-wrap.show{display:flex}.modal{width:min(780px,100%);max-height:86vh;overflow:auto;border-radius:24px;padding:24px;background:linear-gradient(180deg,rgba(23,29,48,.98),rgba(16,21,36,.98));border:1px solid var(--line);box-shadow:var(--shadow)}.modal h2,.modal h3{margin-top:0}.modal p,.modal li{color:var(--muted);line-height:1.75}.actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:18px}.effect-options{display:grid;gap:12px;margin-top:14px}.effect-card strong{display:block;margin-bottom:7px}.tiny{font-size:12px;color:var(--muted)}.skill-list{display:grid;gap:12px}.skill-item{padding:14px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line)}.turn-overlay{position:fixed;inset:0;background:rgba(4,7,14,.92);display:none;align-items:center;justify-content:center;z-index:110;padding:24px;text-align:center}.turn-overlay.show{display:flex}.turn-card{width:min(520px,100%);padding:28px;border-radius:28px;background:linear-gradient(180deg,rgba(24,30,50,.98),rgba(14,18,31,.98));border:1px solid var(--line);box-shadow:var(--shadow)}.turn-card h2{margin-top:0;font-size:34px}.footer-note{color:var(--muted);font-size:13px;text-align:center;margin-top:18px}@media(max-width:1050px){.start-layout,.board-layout{grid-template-columns:1fr}.center-panel{position:static}.hero-title{font-size:48px}.hero-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<section id="startScreen" class="screen active"><div class="wrap"><div class="start-layout"><div class="hero-banner glass"><span class="tag">简洁 UI · 队友机制 · 2~6 人</span><h1 class="hero-title">碰数</h1><p class="subtitle">现在可以给每个玩家选择队伍。同队玩家目标一致：击败其他所有队伍。AI 会避开队友，并优先集火威胁高、血量低、能被击杀的敌方玩家。</p><div class="rules-box"><strong>当前版本要点</strong><p style="margin:10px 0 0">每人初始双手 1 / 1，生命 6。每回合只碰一次。双数字消耗 2 能量。队伍胜利条件：场上只剩同一队伍的存活玩家。</p></div></div><div class="control-card glass"><h2 style="margin:0">开始游戏</h2><div class="mode-grid" id="modeGrid"></div><div class="setup-grid"><div class="rules-box"><div class="pill">人数</div><div style="margin-top:10px"><select id="playerCountSelect"><option value="2">2 人</option><option value="3">3 人</option><option value="4">4 人</option><option value="5">5 人</option><option value="6">6 人</option></select></div></div><div class="rules-box"><div class="pill">操作</div><div style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap"><button id="showRulesBtn" class="secondary">规则介绍</button><button id="showAllHeroesBtn" class="secondary">查看全部英雄</button></div></div></div><div id="selectionArea" style="margin-top:18px"></div></div></div><div class="footer-note">HTML 单文件版本 · 可直接打开运行</div></div></section>
<section id="gameScreen" class="screen"><div class="wrap"><div class="topbar"><div class="pill" id="turnInfo">回合开始</div><div class="right"><button id="ingameRulesBtn" class="secondary">查看规则</button><button id="ingameSkillsBtn" class="secondary">查看技能</button><button id="restartBtn" class="ghost">返回初始界面</button></div></div><div class="board-layout"><div id="centerPanel" class="center-panel glass"></div><div id="playerGrid" class="player-grid"></div></div></div></section>
<div id="modalWrap" class="modal-wrap"><div id="modalContent" class="modal"></div></div><div id="turnOverlay" class="turn-overlay"><div class="turn-card"><h2 id="turnOverlayTitle">轮到玩家</h2><p id="turnOverlayDesc" class="subtitle" style="margin-top:0"></p><button id="turnOverlayBtn">开始操作</button></div></div>
<script>
const MAX_HP=12,MAX_ENERGY=2;
const TEAM_NAMES=['红队','蓝队','绿队','紫队','金队','黑队'];
const HEROES=[
{id:'benzhen',name:'本真',title:'无修饰的原点',short:'不受其他英雄额外效果影响。',skills:['不受其他英雄额外效果影响；基础数字和组合效果仍正常生效。'],passiveFlags:{immuneHeroEffects:true}},
{id:'jibao',name:'纪宝',title:'脂肪储备',short:'打出1攒脂肪，自动减伤。',skills:['碰数后变为1时获得1层脂肪，最多4层。','受到伤害时若脂肪≥2，自动消耗2层使伤害-0.5。']},
{id:'sunlinlin',name:'孙琳琳',title:'一击成名',short:'1 可以造成 1 伤害。',skills:['你的某只手碰数后变为1时，可以选择对任意敌方目标造成1伤害。']},
{id:'dabaili',name:'大白梨',title:'耐打体质',short:'每轮第一次受伤-0.5，最低吃0.5。',skills:['每个自己的回合周期内，第一次受到伤害-0.5；若原伤害大于0，则最低仍受到0.5。']},
{id:'wangyucheng',name:'王煜程',title:'重返牌桌',short:'死亡后3血、5/5复活一次。',skills:['首次死亡时立刻复活一次，生命变为3，左右手数字变为5/5，护盾清零。']},
{id:'zengxinyu',name:'曾新宇',title:'护盾专家',short:'4 额外+0.5护盾。',skills:['当你因4获得护盾时，额外获得0.5护盾。']},
{id:'shenlinlin',name:'申林林',title:'六六顺',short:'6 可指定友方回血。',skills:['当你触发6时，可以令任意友方目标获得这次回复。']},
{id:'mengdeer',name:'孟德尔',title:'93实验',short:'93 消耗2能量造成2伤害。',skills:['当双手组成93时，可消耗2能量对任意敌方目标造成2伤害。组合无顺序。']},
{id:'ye',name:'爷',title:'越杀越狠',short:'击杀后伤害永久+1。',skills:['每次由你造成击杀后，你之后打出的任何伤害永久+1。']},
{id:'wuruofei',name:'武若飞',title:'回春成甲',short:'回血就得0.5护盾。',skills:['每当你回复生命时，获得0.5护盾。']},
{id:'suguan',name:'宿管',title:'盯人压制',short:'连续打同一人+0.5伤害。',skills:['若你这次伤害目标与你上一次造成伤害的目标相同，本次伤害+0.5。']},
{id:'wumingshi',name:'无名氏',title:'顺手一刀',short:'6 回复后扎一个敌人0.5。',skills:['你触发6并成功回复后，对一个敌方目标造成0.5伤害。']},
{id:'wangdan',name:'王丹',title:'三点破局',short:'3 可以造成 1 伤害。',skills:['你的某只手碰数后变为3时，可以选择对任意敌方目标造成1伤害。']},
{id:'laotuqiang',name:'老土枪',title:'穿盾老枪',short:'所有伤害无视护盾。',skills:['你造成的所有伤害无视护盾。']},
{id:'cuixuejun',name:'崔学军',title:'吃痛反打',short:'受伤后下回合回血，下一伤害+1。',skills:['受到伤害后，下回合开始回复0.5，并使下一次造成的伤害+1。']},
{id:'shizhicai',name:'史之才',title:'连段有甲',short:'触发双数字后得0.5护盾。',skills:['当你成功触发双数字效果后，获得0.5护盾。']}
];
const MODES=[{id:'single',name:'单机模式',desc:'玩家1 + 其余AI，可组队。'},{id:'local',name:'本地多人',desc:'2~6人同屏轮流操作，可组队。'}];
const state={mode:'single',setup:{playerCount:2,heroIds:['benzhen','jibao','sunlinlin','dabaili','wangyucheng','zengxinyu'],teams:[0,1,0,1,2,2]},game:null,selectedOwnHand:null,selectedTargetHand:null,aiThinking:false};
const el={startScreen:document.getElementById('startScreen'),gameScreen:document.getElementById('gameScreen'),modeGrid:document.getElementById('modeGrid'),playerCountSelect:document.getElementById('playerCountSelect'),selectionArea:document.getElementById('selectionArea'),modalWrap:document.getElementById('modalWrap'),modalContent:document.getElementById('modalContent'),playerGrid:document.getElementById('playerGrid'),centerPanel:document.getElementById('centerPanel'),turnInfo:document.getElementById('turnInfo'),turnOverlay:document.getElementById('turnOverlay'),turnOverlayTitle:document.getElementById('turnOverlayTitle'),turnOverlayDesc:document.getElementById('turnOverlayDesc'),turnOverlayBtn:document.getElementById('turnOverlayBtn')};
function heroById(id){return HEROES.find(h=>h.id===id)||HEROES[0]}function currentPlayer(){return state.game.players[state.game.currentPlayerIndex]}function alivePlayers(){return state.game.players.filter(p=>!p.dead)}function enemyPlayersOf(p){return state.game.players.filter(x=>!x.dead&&x.team!==p.team)}function allyPlayersOf(p){return state.game.players.filter(x=>!x.dead&&x.team===p.team)}function clone(x){return JSON.parse(JSON.stringify(x))}function hpText(v){return `${'❤️'.repeat(Math.floor(v/2))}${v%2?'💔':''} ${v/2}/${MAX_HP/2}`}function shieldText(v){return v?`${v/2}`:'0'}function log(t){state.game?.log?.unshift({text:t,time:Date.now()})}function switchScreen(w){el.startScreen.classList.toggle('active',w==='start');el.gameScreen.classList.toggle('active',w==='game')}function showModal(html){el.modalContent.innerHTML=html;el.modalWrap.classList.add('show')}function closeModal(){el.modalWrap.classList.remove('show');el.modalContent.innerHTML=''}window.closeModal=closeModal;el.modalWrap.addEventListener('click',e=>{if(e.target===el.modalWrap)closeModal()});
function openHeroModal(id){const h=heroById(id);showModal(`<h2>${h.name}</h2><p>${h.title}</p><div class="skill-list">${h.skills.map((s,i)=>`<div class="skill-item"><strong>技能${i+1}</strong><div>${s}</div></div>`).join('')}</div><div class="actions"><button onclick="closeModal()">关闭</button></div>`)}window.openHeroModal=openHeroModal;
function openAllHeroesModal(){showModal(`<h2>全部英雄</h2><div class="skill-list">${HEROES.map(h=>`<div class="skill-item"><strong>${h.name}</strong><div class="tiny" style="margin-bottom:8px">${h.title}</div><div>• ${h.skills.join('</div><div style="margin-top:6px">• ')}</div></div>`).join('')}</div><div class="actions"><button onclick="closeModal()">关闭</button></div>`)}
function openRulesModal(){showModal(`<h2>规则介绍</h2><div class="rules-box"><strong>基础</strong><p>每人初始生命6，左右手数字均为1。每回合最多碰一次，不能碰自己。自己的手碰到别人某只手后，自己的该手变为<b>(自己的数+对方的数)取个位数</b>。</p></div><div class="rules-box"><strong>队伍</strong><p>开局可选择队伍。同队玩家不能被普通伤害目标选择，胜利条件是击败其他所有队伍；场上只剩同一队伍存活时该队获胜。</p></div><div class="rules-box"><strong>单数字</strong><p>4：获得1护盾。5/8/0：造成1伤害。6：立刻回复1生命，并在下回合再回复0.5生命。部分英雄让1或3也能触发伤害。</p></div><div class="rules-box"><strong>双数字</strong><p>每回合开始+1能量，最多2。双数字消耗<b>2能量</b>：55/98造成2伤害；69/90造成1伤害并回复1生命；孟德尔93造成2伤害。组合无顺序。</p></div><div class="rules-box"><strong>血量</strong><p>最小单位为0.5。❤️=1生命，💔=0.5生命。护盾也按0.5结算。</p></div><div class="actions"><button onclick="closeModal()">我知道了</button></div>`)}
function renderModeOptions(){el.modeGrid.innerHTML=MODES.map(m=>`<div class="mode-btn ${state.mode===m.id?'active':''}" data-mode="${m.id}"><strong>${m.name}</strong><div class="tiny">${m.desc}</div></div>`).join('');el.modeGrid.querySelectorAll('.mode-btn').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;renderModeOptions();renderSelectionArea()})}
function ensureSetup(){while(state.setup.heroIds.length<6)state.setup.heroIds.push(HEROES[state.setup.heroIds.length%HEROES.length].id);while(state.setup.teams.length<6)state.setup.teams.push(state.setup.teams.length%2)}
function renderSelectionArea(){ensureSetup();const n=state.setup.playerCount;let html=`<div class="rules-box"><strong>队伍与英雄选择</strong><p style="margin:10px 0 0">同队目标一致：击败其他所有队伍。单机模式下，玩家1为真人，其余为AI。</p></div>`;for(let i=0;i<n;i++){const label=i===0?'玩家1':(state.mode==='single'?`AI${i}`:`玩家${i+1}`);html+=`<div class="player-setup"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><div class="pill">${label}</div><div class="team-row">${TEAM_NAMES.slice(0,n).map((name,t)=>`<div class="team-card ${state.setup.teams[i]===t?'selected':''}" data-slot="${i}" data-team="${t}">${name}</div>`).join('')}</div></div><div class="hero-grid">${HEROES.map(h=>`<div class="hero-card ${state.setup.heroIds[i]===h.id?'selected':''}" data-slot="${i}" data-hero="${h.id}"><div><h4>${h.name}</h4><p>${h.short}</p></div><div class="mini-actions"><span class="pill">${label}</span><button class="ghost" data-viewhero="${h.id}">技能</button></div></div>`).join('')}</div></div>`}html+=`<div style="display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap"><button id="randomHeroesBtn" class="secondary">随机英雄</button><button id="defaultTeamsBtn" class="secondary">默认分队</button><button id="startGameBtn">开始对局</button></div>`;el.selectionArea.innerHTML=html;el.selectionArea.querySelectorAll('.hero-card').forEach(c=>c.onclick=e=>{if(e.target.closest('button'))return;state.setup.heroIds[+c.dataset.slot]=c.dataset.hero;renderSelectionArea()});el.selectionArea.querySelectorAll('.team-card').forEach(c=>c.onclick=()=>{state.setup.teams[+c.dataset.slot]=+c.dataset.team;renderSelectionArea()});el.selectionArea.querySelectorAll('[data-viewhero]').forEach(b=>b.onclick=()=>openHeroModal(b.dataset.viewhero));document.getElementById('randomHeroesBtn').onclick=()=>{state.setup.heroIds=Array.from({length:n},()=>HEROES[Math.floor(Math.random()*HEROES.length)].id);renderSelectionArea()};document.getElementById('defaultTeamsBtn').onclick=()=>{state.setup.teams=Array.from({length:6},(_,i)=>i%2);renderSelectionArea()};document.getElementById('startGameBtn').onclick=startGame}
function createPlayer(name,heroId,isAI,team){return{name,heroId,isAI,team,hp:MAX_HP,maxHp:MAX_HP,hands:[1,1],shield:0,energy:0,pendingHeal:0,dead:false,fat:0,firstDamageReducedAvailable:false,reviveUsed:false,killBonus:0,lastDamagedTargetIndex:null,pendingNextTurnDamageBuff:0}}
function startGame(){state.game={turn:1,currentPlayerIndex:0,players:[],log:[],winner:null};state.selectedOwnHand=null;state.selectedTargetHand=null;state.aiThinking=false;const n=state.setup.playerCount;const liveTeams=new Set(state.setup.teams.slice(0,n));if(liveTeams.size<2){alert('至少需要两个不同队伍。');return}for(let i=0;i<n;i++){const name=i===0?'玩家1':(state.mode==='single'?`AI${i}`:`玩家${i+1}`);const isAI=state.mode==='single'&&i>0;state.game.players.push(createPlayer(name,state.setup.heroIds[i],isAI,state.setup.teams[i]));log(`${name} 加入${TEAM_NAMES[state.setup.teams[i]]}，选择了【${heroById(state.setup.heroIds[i]).name}】。`)}switchScreen('game');beginTurn()}
function nextAliveIndex(from){const len=state.game.players.length;for(let i=1;i<=len;i++){const idx=(from+i)%len;if(!state.game.players[idx].dead)return idx}return from}
function beginTurn(){if(state.game.winner)return;state.selectedOwnHand=null;state.selectedTargetHand=null;const p=currentPlayer();if(p.dead){endTurn();return}p.energy=Math.min(MAX_ENERGY,p.energy+1);p.firstDamageReducedAvailable=heroById(p.heroId).id==='dabaili';if(p.pendingHeal>0){healPlayer(p,p.pendingHeal,`${p.name} 的延迟回复生效，回复 ${p.pendingHeal/2} 生命。`,false);p.pendingHeal=0}if(p.pendingNextTurnDamageBuff>0){log(`【崔学军】本回合下一次伤害 +${p.pendingNextTurnDamageBuff/2}。`)}log(`轮到 ${p.name}。获得 1 能量。`);renderGame();if(state.mode==='local')showTurnOverlay(`${p.name} 的回合`,`请由 ${p.name} 操作。队伍：${TEAM_NAMES[p.team]}`);else if(p.isAI)runAI()}
function showTurnOverlay(t,d){el.turnOverlayTitle.textContent=t;el.turnOverlayDesc.textContent=d;el.turnOverlay.classList.add('show')}el.turnOverlayBtn.onclick=()=>{el.turnOverlay.classList.remove('show');if(currentPlayer().isAI&&!state.aiThinking)runAI()};
function endTurn(){if(checkWinner())return;state.game.currentPlayerIndex=nextAliveIndex(state.game.currentPlayerIndex);state.game.turn++;beginTurn()}
function checkWinner(){const alive=alivePlayers();const teams=[...new Set(alive.map(p=>p.team))];if(teams.length<=1){state.game.winner=teams.length?teams[0]:null;renderGame();showModal(`<h2>${teams.length?`${TEAM_NAMES[teams[0]]} 获胜！`:'对局结束'}</h2><p>${alive.map(p=>`${p.name}（${heroById(p.heroId).name}）`).join('、')}</p><div class="actions"><button onclick="closeModal();switchToStart()">回到初始界面</button></div>`);return true}return false}window.switchToStart=()=>{closeModal();switchScreen('start')};
function healPlayer(player,amount,reason,isHeroModified=false){const before=player.hp;player.hp=Math.min(player.maxHp,player.hp+amount);const real=player.hp-before;if(real>0&&reason)log(reason);if(real>0&&heroById(player.heroId).id==='wuruofei'){player.shield+=1;log(`【武若飞】回复生命后获得 0.5 护盾。`)}return real}
function buildDamageAmount(source,target,base,type){let dmg=base,boost=false;const hid=heroById(source.heroId).id;if(hid==='ye'&&source.killBonus>0){dmg+=source.killBonus*2;boost=true;log(`【爷】击杀层数使伤害 +${source.killBonus}。`)}if(hid==='suguan'&&source.lastDamagedTargetIndex===state.game.players.indexOf(target)){dmg+=1;boost=true;log(`【宿管】连续压制同一目标，伤害 +0.5。`)}if(hid==='cuixuejun'&&source.pendingNextTurnDamageBuff>0){dmg+=source.pendingNextTurnDamageBuff;source.pendingNextTurnDamageBuff=0;boost=true;log(`【崔学军】反打加成生效，伤害 +1。`)}return{dmg,boost}}
function applyDamage(source,target,amount,reason,isHeroModified=false){if(!target||target.dead||amount<=0)return 0;const tHero=heroById(target.heroId);if(tHero.passiveFlags?.immuneHeroEffects&&isHeroModified){log(`【本真】无视了英雄额外效果。`);return 0}let dmg=amount;if(heroById(target.heroId).id==='jibao'&&target.fat>=2){target.fat-=2;dmg=Math.max(0,dmg-1);log(`${target.name} 消耗 2 层脂肪，使伤害 -0.5。`)}if(heroById(target.heroId).id==='dabaili'&&target.firstDamageReducedAvailable){target.firstDamageReducedAvailable=false;dmg=Math.max(amount>0?1:0,dmg-1);log(`【大白梨】使本次伤害 -0.5，最低仍受到0.5。`)}const ignoreShield=source&&heroById(source.heroId).id==='laotuqiang';let absorbed=0;if(target.shield>0&&dmg>0&&!ignoreShield){absorbed=Math.min(target.shield,dmg);target.shield-=absorbed;dmg-=absorbed}target.hp=Math.max(0,target.hp-dmg);if(reason)log(`${reason}${absorbed>0?`（护盾抵挡 ${absorbed/2}）`:ignoreShield&&target.shield>0?'（无视护盾）':''}`);if(source&&dmg>0)source.lastDamagedTargetIndex=state.game.players.indexOf(target);if(dmg>0&&heroById(target.heroId).id==='cuixuejun'){target.pendingHeal+=1;target.pendingNextTurnDamageBuff=2;log(`【崔学军】将在下回合开始回复0.5，且下一次伤害+1。`)}if(target.hp<=0){if(heroById(target.heroId).id==='wangyucheng'&&!target.reviveUsed){target.reviveUsed=true;target.dead=false;target.hp=6;target.hands=[5,5];target.shield=0;log(`【王煜程】首次死亡后复活：3生命，双手5/5。`)}else{target.dead=true;log(`${target.name} 被击败。`);if(source&&source!==target&&dmg>0&&heroById(source.heroId).id==='ye'){source.killBonus++;log(`【爷】完成击杀，永久伤害 +1。当前层数：${source.killBonus}`)}}}return dmg}
function gainShield(p,a,reason){let add=a;if(heroById(p.heroId).id==='zengxinyu'){add+=1;log(`【曾新宇】使护盾额外 +0.5。`)}p.shield+=add;if(reason)log(reason.replace('{shield}',add/2))}
function comboType(hands){const s=[...hands].sort((a,b)=>a-b).join('');if(s==='55'||s==='89')return'doubleDamage';if(s==='69'||s==='09')return'damageAndHeal';if(s==='39')return'mengdeer93';return null}
function triggerOptionsForPlayer(player,changed){const opts=[];const hid=heroById(player.heroId).id;if(changed===4)opts.push({type:'single-4',label:'单数字4',desc:'获得1护盾。'});if([5,8,0].includes(changed))opts.push({type:`single-${changed}`,label:`单数字${changed}`,desc:'对敌方目标造成1伤害。'});if(changed===6)opts.push({type:'single-6',label:'单数字6',desc:'回复1生命，下回合再回复0.5。'});if(changed===1&&hid==='sunlinlin')opts.push({type:'hero-sunlinlin-1',label:'孙琳琳 · 1',desc:'对敌方目标造成1伤害。'});if(changed===3&&hid==='wangdan')opts.push({type:'hero-wangdan-3',label:'王丹 · 3',desc:'对敌方目标造成1伤害。'});const combo=comboType(player.hands);if(combo&&player.energy>=2){if(combo==='doubleDamage')opts.push({type:'combo-doubleDamage',label:'双数字组合',desc:'消耗2能量：造成2伤害。'});if(combo==='damageAndHeal')opts.push({type:'combo-damageAndHeal',label:'双数字组合',desc:'消耗2能量：造成1伤害并回复1生命。'});if(combo==='mengdeer93'&&hid==='mengdeer')opts.push({type:'combo-mengdeer93',label:'孟德尔 · 93',desc:'消耗2能量：造成2伤害。'});}return opts}
function chooseTargetModal(title,desc,candidates,cb){showModal(`<h2>${title}</h2><p>${desc}</p><div class="effect-options">${candidates.map((p,i)=>`<div class="effect-card" data-target="${i}"><strong>${p.name} · ${TEAM_NAMES[p.team]}</strong><div>英雄：${heroById(p.heroId).name} · 血量：${p.hp/2} · 护盾：${p.shield/2}</div></div>`).join('')}</div>`);el.modalContent.querySelectorAll('[data-target]').forEach(n=>n.onclick=()=>{const t=candidates[+n.dataset.target];closeModal();cb(t)})}
function resolveEffect(player,e,aiTarget=null){const hid=heroById(player.heroId).id;const enemies=enemyPlayersOf(player);if(e.type==='single-4'){gainShield(player,2,`${player.name} 获得 {shield} 护盾。`);renderGame();setTimeout(endTurn,250);return}const finish=()=>{renderGame();setTimeout(endTurn,250)};const damageTarget=(base,title)=>{const run=t=>{const b=buildDamageAmount(player,t,base,e.type);applyDamage(player,t,b.dmg,`${title}，对 ${t.name} 造成 ${b.dmg/2} 伤害。`,b.boost);finish()};if(aiTarget)run(aiTarget);else chooseTargetModal('选择敌方目标','只能选择其他队伍的存活目标。',enemies,run)};if(['single-5','single-8','single-0','hero-sunlinlin-1','hero-wangdan-3'].includes(e.type)){damageTarget(2,`${player.name} 触发 ${e.label||e.type}`);return}if(e.type==='single-6'){const allies=allyPlayersOf(player);const heal=t=>{healPlayer(t,2,`${player.name} 触发6，使 ${t.name} 回复1生命。`);t.pendingHeal+=1;log(`${t.name} 获得0.5延迟回复。`);if(hid==='wumingshi'){const target=aiTarget||pickAITarget(player);if(target)applyDamage(player,target,1,`【无名氏】顺手对 ${target.name} 造成0.5伤害。`,true)}finish()};if(hid==='shenlinlin'&&!aiTarget)chooseTargetModal('选择友方回复目标','申林林可以指定友方吃到6的回复。',allies,heal);else heal(aiTarget&&aiTarget.team===player.team?aiTarget:player);return}if(e.type==='combo-doubleDamage'||e.type==='combo-mengdeer93'){player.energy-=2;damageTarget(4,e.type==='combo-mengdeer93'?`【孟德尔】93触发`:`${player.name} 触发双数字组合`);if(hid==='shizhicai')gainShield(player,1,`【史之才】双数字后获得 {shield} 护盾。`);return}if(e.type==='combo-damageAndHeal'){player.energy-=2;const run=t=>{const b=buildDamageAmount(player,t,2,e.type);applyDamage(player,t,b.dmg,`${player.name} 触发双数字组合，对 ${t.name} 造成 ${b.dmg/2} 伤害。`,b.boost);healPlayer(player,2,`${player.name} 因双数字组合回复1生命。`);if(hid==='shizhicai')gainShield(player,1,`【史之才】双数字后获得 {shield} 护盾。`);finish()};if(aiTarget)run(aiTarget);else chooseTargetModal('选择敌方目标','消耗2能量，造成1伤害并回复1生命。',enemies,run)}}
function openEffectChoiceModal(player,opts){showModal(`<h2>选择要触发的效果</h2><p>只能选择1个效果。</p><div class="effect-options">${opts.map((o,i)=>`<div class="effect-card" data-effect="${i}"><strong>${o.label}</strong><div>${o.desc}</div></div>`).join('')}<div class="effect-card" data-effect="skip"><strong>不触发</strong><div>直接结束回合。</div></div></div>`);el.modalContent.querySelectorAll('[data-effect]').forEach(n=>n.onclick=()=>{const v=n.dataset.effect;closeModal();if(v==='skip')setTimeout(endTurn,200);else resolveEffect(player,opts[+v])})}
function performAction(ownIndex,targetIndex,ownHand,targetHand){const p=state.game.players[ownIndex],t=state.game.players[targetIndex];if(p.dead||t.dead||p===t)return;const old=p.hands[ownHand],td=t.hands[targetHand],res=(old+td)%10;p.hands[ownHand]=res;log(`${p.name} 用自己的${ownHand===0?'左手':'右手'} ${old} 碰了 ${t.name} 的${targetHand===0?'左手':'右手'} ${td}，变成 ${res}。`);if(heroById(p.heroId).id==='jibao'&&res===1){p.fat=Math.min(4,p.fat+1);log(`【纪宝】获得1层脂肪。当前：${p.fat}/4`)}renderGame();const opts=triggerOptionsForPlayer(p,res);if(!opts.length)setTimeout(endTurn,300);else if(p.isAI){const chosen=chooseAIEffect(p,opts);setTimeout(()=>resolveEffect(p,chosen,pickAITargetForEffect(p,chosen)),220)}else openEffectChoiceModal(p,opts)}
function renderPlayerPanel(p,idx){const h=heroById(p.heroId),isCur=state.game.currentPlayerIndex===idx;const selectedOwn=state.selectedOwnHand?.playerIdx===idx?state.selectedOwnHand.handIdx:null;const selectedTarget=state.selectedTargetHand?.playerIdx===idx?state.selectedTargetHand.handIdx:null;return `<div class="player-head"><div><h3>${p.name}</h3><div class="hero-name">${h.name} · ${TEAM_NAMES[p.team]}</div></div><button class="secondary" onclick="openHeroModal('${h.id}')">技能</button></div><div class="status-row"><span class="pill">血量：${hpText(p.hp)}</span><span class="pill">护盾：${shieldText(p.shield)}</span><span class="pill">能量：${p.energy}/${MAX_ENERGY}</span>${h.id==='jibao'?`<span class="pill">脂肪：${p.fat}/4</span>`:''}${h.id==='ye'?`<span class="pill">击杀层：${p.killBonus}</span>`:''}${h.id==='wangyucheng'?`<span class="pill">复活：${p.reviveUsed?'已用':'未用'}</span>`:''}</div><div class="tiny">${h.short}${p.pendingHeal?` · 下回合回复 ${p.pendingHeal/2}`:''}${p.pendingNextTurnDamageBuff?` · 下次伤害 +${p.pendingNextTurnDamageBuff/2}`:''}</div><div class="hands">${p.hands.map((d,hi)=>{let cls='hand';const selectable=!p.dead&&!state.game.winner&&!currentPlayer().isAI;if(selectable)cls+=' selectable';if(selectedOwn===hi||selectedTarget===hi)cls+=' selected';return `<div class="${cls}" data-playeridx="${idx}" data-handidx="${hi}"><div class="label">${hi===0?'左手':'右手'}</div><div class="digit">${d}</div><div class="hint">${idx===state.game.currentPlayerIndex?'自己的手':'可碰目标'}</div></div>`}).join('')}</div>`}
function renderCenterPanel(){const p=currentPlayer();const ownText=state.selectedOwnHand?`${state.selectedOwnHand.handIdx===0?'左手':'右手'} ${p.hands[state.selectedOwnHand.handIdx]}`:'未选择';const targetText=state.selectedTargetHand?`${state.game.players[state.selectedTargetHand.playerIdx].name} 的${state.selectedTargetHand.handIdx===0?'左手':'右手'} ${state.game.players[state.selectedTargetHand.playerIdx].hands[state.selectedTargetHand.handIdx]}`:'未选择';return `<div class="action-box"><h3>当前操作</h3><div class="selected-summary"><div>当前玩家：<b>${p.name}</b>（${heroById(p.heroId).name} · ${TEAM_NAMES[p.team]}）</div><div>自己的手：<b>${ownText}</b></div><div>目标的手：<b>${targetText}</b></div></div><div class="action-seq"><div class="seq-item">① 点自己的左手或右手</div><div class="seq-item">② 点其他玩家的一只手；同队也可以被碰数，但伤害目标默认只能选敌队</div><div class="seq-item">③ 碰数后弹窗选择触发1个效果</div></div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px"><button id="endTurnBtn" class="ghost">结束回合</button></div></div><div class="log">${state.game.log.map(i=>`<div class="log-entry">${i.text}</div>`).join('')}</div>`}
function renderGame(){if(!state.game)return;el.playerGrid.innerHTML=state.game.players.map((p,i)=>`<div class="player-panel glass ${state.game.currentPlayerIndex===i?'current':''} ${p.dead?'dead':''}">${renderPlayerPanel(p,i)}</div>`).join('');el.centerPanel.innerHTML=renderCenterPanel();const cp=currentPlayer();el.turnInfo.textContent=state.game.winner?'对局结束':`${cp.name} 的回合 · ${TEAM_NAMES[cp.team]} · 能量 ${cp.energy}/${MAX_ENERGY}`;attachBoardEvents()}
function attachBoardEvents(){document.querySelectorAll('.hand').forEach(hand=>hand.onclick=()=>{if(state.game.winner||currentPlayer().isAI)return;const pIdx=+hand.dataset.playeridx,hIdx=+hand.dataset.handidx,cur=state.game.currentPlayerIndex;if(pIdx===cur){state.selectedOwnHand={playerIdx:pIdx,handIdx:hIdx};state.selectedTargetHand=null;renderGame()}else{if(!state.selectedOwnHand)return;state.selectedTargetHand={playerIdx:pIdx,handIdx:hIdx};performAction(cur,pIdx,state.selectedOwnHand.handIdx,hIdx)}});const btn=document.getElementById('endTurnBtn');if(btn)btn.onclick=()=>endTurn()}
function threatScore(t){let s=(MAX_HP-t.hp)*.7+t.shield*.25+t.energy*.8;if(comboType(t.hands)&&t.energy>=2)s+=3;if(heroById(t.heroId).id==='ye')s+=t.killBonus*3;if(['laotuqiang','mengdeer','wangdan','sunlinlin'].includes(heroById(t.heroId).id))s+=1.2;if(t.hp<=4)s+=2.5;return s}
function scoreMove(ai,target,result,nextHands){let score=threatScore(target);const combo=comboType(nextHands);if([5,8,0].includes(result))score+=4;if(result===1&&heroById(ai.heroId).id==='sunlinlin')score+=4;if(result===3&&heroById(ai.heroId).id==='wangdan')score+=4;if(result===6)score+=ai.hp<ai.maxHp?3:1;if(result===4)score+=ai.shield<2?2:0.6;if(combo&&ai.energy>=2){score+=combo==='damageAndHeal'?5:7;if(combo==='mengdeer93'&&heroById(ai.heroId).id==='mengdeer')score+=7}if(target.hp<=4)score+=3;if(target.hp<=2&&([5,8,0,1,3].includes(result)||combo))score+=5;return score+Math.random()}
function pickAITarget(ai){return enemyPlayersOf(ai).sort((a,b)=>threatScore(b)-threatScore(a))[0]||null}
function pickAITargetForEffect(ai,e){if(e.type==='single-6'&&heroById(ai.heroId).id==='shenlinlin'){return allyPlayersOf(ai).sort((a,b)=>a.hp-b.hp)[0]||ai}return pickAITarget(ai)}
function chooseAIEffect(ai,opts){return opts.slice().sort((a,b)=>effectPriority(ai,b)-effectPriority(ai,a))[0]}function effectPriority(ai,o){if(o.type.includes('combo-doubleDamage')||o.type.includes('mengdeer93'))return 9;if(o.type==='combo-damageAndHeal')return ai.hp<MAX_HP?8:7;if(['single-5','single-8','single-0','hero-sunlinlin-1','hero-wangdan-3'].includes(o.type))return 6;if(o.type==='single-6')return ai.hp<MAX_HP?5:2;if(o.type==='single-4')return ai.shield<2?4:1;return 0}
function runAI(){const ai=currentPlayer();if(!ai.isAI||state.aiThinking||state.game.winner)return;state.aiThinking=true;const enemies=enemyPlayersOf(ai);const touchables=state.game.players.filter(p=>!p.dead&&p!==ai);let best=null;for(let oi=0;oi<2;oi++){for(const target of touchables){const ti=state.game.players.indexOf(target);for(let th=0;th<2;th++){const res=(ai.hands[oi]+target.hands[th])%10;const next=clone(ai.hands);next[oi]=res;let sc=scoreMove(ai,enemies.includes(target)?target:(pickAITarget(ai)||target),res,next);if(target.team===ai.team)sc-=1.2; if(!best||sc>best.score)best={targetIdx:ti,ownHandIdx:oi,targetHandIdx:th,score:sc}}}}setTimeout(()=>{if(best)performAction(state.game.currentPlayerIndex,best.targetIdx,best.ownHandIdx,best.targetHandIdx);state.aiThinking=false},550)}
function openIngameSkillsModal(){showModal(`<h2>本局英雄技能</h2><div class="skill-list">${state.game.players.map(p=>`<div class="skill-item"><strong>${p.name} · ${TEAM_NAMES[p.team]} · ${heroById(p.heroId).name}</strong><div style="margin-top:8px">• ${heroById(p.heroId).skills.join('</div><div style="margin-top:6px">• ')}</div></div>`).join('')}</div><div class="actions"><button onclick="closeModal()">关闭</button></div>`)}
document.getElementById('showRulesBtn').onclick=openRulesModal;document.getElementById('showAllHeroesBtn').onclick=openAllHeroesModal;document.getElementById('ingameRulesBtn').onclick=openRulesModal;document.getElementById('ingameSkillsBtn').onclick=openIngameSkillsModal;document.getElementById('restartBtn').onclick=()=>switchScreen('start');el.playerCountSelect.onchange=()=>{state.setup.playerCount=+el.playerCountSelect.value;renderSelectionArea()};renderModeOptions();renderSelectionArea();
</script>
